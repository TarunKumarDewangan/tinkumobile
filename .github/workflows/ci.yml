name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory only: ~224 pre-existing lint errors across the codebase as of
      # 2026-07 mean this can't be a hard gate yet without blocking unrelated
      # PRs. Reported so it's visible, not silently ignored. Flip to a real
      # gate (remove continue-on-error) once that backlog is paid down.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
