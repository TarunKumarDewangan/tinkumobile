name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button = test + deploy by hand

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory only: ~224 pre-existing lint errors across the codebase as of
      # 2026-07 mean this can't be a hard gate yet without blocking unrelated
      # PRs. Reported so it's visible, not silently ignored. Flip to a real
      # gate (remove continue-on-error) once that backlog is paid down.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Keep build for deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true # .htaccess
          retention-days: 3

  # Deploys only after BOTH test jobs pass. Skips itself (green, with a notice)
  # until the SSH secrets are added in GitHub → Settings → Secrets → Actions.
  # Put "[skip deploy]" in a commit message to push without deploying.
  deploy:
    name: Deploy (Hostinger)
    needs: [backend, frontend]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      API_DIR: domains/api.tinkumobile.in            # git repo on the server (relative to home)
      FRONT_DIR: domains/tinkumobile.in/public_html  # website files
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy skipped - SSH secrets are not set yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get frontend build
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Set up SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          # Keys pasted from Windows often carry \r line endings, which OpenSSH
          # rejects ("error in libcrypto") — strip them and end with a newline.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::SSH_PRIVATE_KEY secret is not a valid private key. Paste the WHOLE file, from -----BEGIN to -----END ... KEY-----"
            exit 1
          fi
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes $SSH_USER@$SSH_HOST" >> "$GITHUB_ENV"

      # Backend first: new API code is live before the new screens arrive.
      - name: Backend - git pull, composer, migrate, OPcache
        if: steps.check.outputs.enabled == 'true'
        run: |
          $SSH "set -e; cd $API_DIR; OLD=\$(git rev-parse HEAD); GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main; bash deploy/backend.sh \$OLD"

      # Old files are NOT deleted, so tabs still open on the previous version keep
      # working. index.html and sw.js go last, so nobody gets a half-copied site.
      # Asset files unused for 14 days are cleaned up.
      - name: Frontend - upload dist
        if: steps.check.outputs.enabled == 'true'
        run: |
          cd dist
          tar -czf - --exclude=./index.html --exclude=./sw.js . | $SSH "mkdir -p $FRONT_DIR && tar -xzf - -C $FRONT_DIR"
          tar -czf - ./index.html ./sw.js | $SSH "tar -xzf - -C $FRONT_DIR"
          $SSH "find $FRONT_DIR/assets -type f -mtime +14 -delete 2>/dev/null || true"
          echo "Frontend deployed."
